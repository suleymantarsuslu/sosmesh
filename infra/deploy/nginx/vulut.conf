# HTTP-only gateway for the VULUT Coolify deployment (sosmesh.antiosoft.com).
# TLS is terminated by Coolify's Traefik (Let's Encrypt); this nginx only routes
# by path, following infra/deploy/nginx/staging.conf.template:
#   /health, /health/ready, /v1/*  -> api:3001
#   everything else                -> web:3000 (operator panel)
# /metrics and /docs are intentionally NOT routed to the API.
# Docker DNS re-resolution so a restarted api/web container does not leave nginx on a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /gateway-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /health {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream/health;
    proxy_http_version 1.1;
    access_log off;
  }

  location = /health/ready {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream/health/ready;
    proxy_http_version 1.1;
    access_log off;
  }

  location /v1/ {
    set $api_upstream http://api:3001;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    set $web_upstream http://web:3000;
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
  }
}
