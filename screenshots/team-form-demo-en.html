<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Team - EN</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; }
    .modal-content { background: white; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
    .modal-header { padding: 20px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 20px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 28px; cursor: pointer; color: #666; }
    .modal-form { padding: 20px; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-weight: 500; margin-bottom: 4px; color: #333; font-size: 14px; }
    .form-field input, .form-field select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .form-field input:focus, .form-field select:focus { outline: none; border-color: #1976d2; }
    .modal-actions { display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid #e0e0e0; }
    .button { padding: 10px 20px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
    .button--primary { background: #1976d2; color: white; }
    .button--secondary { background: #e0e0e0; color: #333; }
    span[aria-label="required"] { color: #d32f2f; margin-left: 2px; }
  </style>
</head>
<body>
  <div class="modal-overlay">
    <div class="modal-content">
      <header class="modal-header">
        <h2>Create Team</h2>
        <button type="button" class="modal-close" aria-label="Close">×</button>
      </header>
      <form class="modal-form">
        <div class="form-field">
          <label for="team-name">Team name <span aria-label="required">*</span></label>
          <input id="team-name" type="text" value="Medical Response Team Alpha" required />
        </div>
        <div class="form-field">
          <label for="team-type">Type / Specialty</label>
          <select id="team-type">
            <option value="GENERAL">General</option>
            <option value="MEDICAL" selected>Medical</option>
            <option value="SEARCH_RESCUE">Search & Rescue</option>
            <option value="FIRE">Fire</option>
            <option value="POLICE">Police</option>
            <option value="TECHNICAL">Technical</option>
            <option value="LOGISTICS">Logistics</option>
          </select>
        </div>
        <div class="form-field">
          <label for="team-capacity">Member count</label>
          <input id="team-capacity" type="number" min="1" max="1000" value="15" />
        </div>
        <div class="form-field">
          <label for="team-contact">Contact / Radio callsign</label>
          <input id="team-contact" type="text" value="Radio-MED-001" />
        </div>
        <div class="form-field">
          <label for="team-status">Status <span aria-label="required">*</span></label>
          <select id="team-status" required>
            <option value="ACTIVE" selected>Active</option>
            <option value="STANDBY">Standby</option>
            <option value="OFF_DUTY">Off duty</option>
          </select>
        </div>
        <div class="form-field">
          <label for="team-zone">Home zone</label>
          <input id="team-zone" type="text" value="District-A" />
        </div>
        <div class="modal-actions">
          <button type="button" class="button button--secondary">Cancel</button>
          <button type="submit" class="button button--primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
