openapi: 3.1.0
info:
  title: SOSMesh API
  version: 1.0.0
  description: Emergency mesh network API for SOS message relay
servers:
  - url: http://localhost:3001
    description: Local development
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, error]
                  timestamp:
                    type: string
                    format: date-time
  /sos:
    post:
      summary: Submit SOS message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../packages/contracts/schemas/sos-message.schema.json'
      responses:
        '201':
          description: SOS message received
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  ackLevel:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
