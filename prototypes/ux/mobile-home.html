<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>SOSMesh — Ana Sayfa</title>
  <link rel="stylesheet" href="../../packages/design-tokens/tokens.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--type-fontFamily-base);
      font-size: var(--type-fontSize-base);
      line-height: var(--type-lineHeight-normal);
      background: var(--color-surface-primary);
      color: var(--color-text-primary);
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      padding: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-surface-secondary);
      box-shadow: var(--elevation-2);
    }
    
    .logo {
      font-size: var(--type-fontSize-xl);
      font-weight: var(--type-fontWeight-bold);
      color: var(--color-sos);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--type-fontSize-sm);
      color: var(--color-text-secondary);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--color-success);
    }
    
    .status-dot.offline {
      background: var(--color-offline);
    }
    
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
    }
    
    .sos-button {
      width: clamp(180px, 40vw, 240px);
      height: 120px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-sos) 0%, var(--color-danger) 100%);
      color: var(--color-text-onSos);
      font-size: var(--type-fontSize-3xl);
      font-weight: var(--type-fontWeight-bold);
      border: none;
      cursor: pointer;
      box-shadow: var(--elevation-4);
      transition: transform 150ms var(--animation-easing-easeOut);
      touch-action: manipulation;
      user-select: none;
    }
    
    .sos-button:active {
      transform: scale(0.95);
      box-shadow: var(--elevation-3);
    }
    
    .sos-instructions {
      margin-top: var(--space-4);
      text-align: center;
      color: var(--color-text-secondary);
      font-size: var(--type-fontSize-sm);
    }
    
    .banner {
      padding: var(--space-3);
      background: var(--color-warning);
      color: var(--color-text-primary);
      text-align: center;
      font-size: var(--type-fontSize-sm);
      display: none;
    }
    
    .banner.offline {
      display: block;
      background: var(--color-offline);
      color: white;
    }
    
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background: var(--color-surface-secondary);
      box-shadow: var(--elevation-3);
      padding: var(--space-2) 0;
    }
    
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-1);
      padding: var(--space-2);
      color: var(--color-text-secondary);
      text-decoration: none;
      font-size: var(--type-fontSize-xs);
      transition: color 150ms;
      min-height: var(--touch-default);
    }
    
    .nav-item.active {
      color: var(--color-sos);
    }
    
    .nav-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    
    .theme-toggle {
      position: fixed;
      top: var(--space-4);
      right: var(--space-4);
      padding: var(--space-2);
      background: var(--color-surface-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-base);
      cursor: pointer;
      min-width: var(--touch-default);
      min-height: var(--touch-default);
    }
    
    .lang-toggle {
      position: fixed;
      bottom: calc(var(--touch-default) + var(--space-16));
      right: var(--space-4);
      padding: var(--space-2);
      background: var(--color-surface-tertiary);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-base);
      cursor: pointer;
      min-width: var(--touch-default);
      min-height: var(--touch-default);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">SOSMesh</div>
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Çevrimiçi</span>
    </div>
  </div>
  
  <div class="banner offline" id="offlineBanner" style="display:none">
    İnternet yok — Yalnız yakın cihazlara gönderilecek
  </div>
  
  <main class="main">
    <button class="sos-button" id="sosButton" aria-label="SOS gönder, basılı tutun">
      SOS
    </button>
    <p class="sos-instructions">3 saniye basılı tutun</p>
  </main>
  
  <nav class="bottom-nav" role="navigation" aria-label="Ana navigasyon">
    <a href="mobile-home.html" class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span data-i18n="nav.home">Ana Sayfa</span>
    </a>
    <a href="mobile-status.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
      <span data-i18n="nav.status">Durum</span>
    </a>
    <a href="mobile-relay.html" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      <span data-i18n="nav.relay">Relay</span>
    </a>
    <a href="#" class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span data-i18n="nav.settings">Ayarlar</span>
    </a>
  </nav>
  
  <button class="theme-toggle" id="themeToggle" aria-label="Temayı değiştir">🌓</button>
  <button class="lang-toggle" id="langToggle" aria-label="Dili değiştir">TR</button>
  
  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    
    themeToggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', newTheme);
      themeToggle.textContent = newTheme === 'light' ? '🌓' : '☀️';
    });
    
    // Lang toggle
    const langToggle = document.getElementById('langToggle');
    langToggle.addEventListener('click', () => {
      const currentLang = html.getAttribute('lang');
      const newLang = currentLang === 'tr' ? 'en' : 'tr';
      html.setAttribute('lang', newLang);
      langToggle.textContent = newLang.toUpperCase();
      
      // Simple i18n (simplified for prototype)
      const statusText = document.getElementById('statusText');
      statusText.textContent = newLang === 'tr' ? 'Çevrimiçi' : 'Online';
    });
    
    // SOS button hold behavior (simplified)
    let holdTimer;
    const sosButton = document.getElementById('sosButton');
    
    sosButton.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      holdTimer = setTimeout(() => {
        alert('SOS göndermek istediğinize emin misiniz?');
      }, 3000);
    });
    
    sosButton.addEventListener('pointerup', () => {
      clearTimeout(holdTimer);
    });
    
    sosButton.addEventListener('pointercancel', () => {
      clearTimeout(holdTimer);
    });
    
    // Simulate offline state toggle (for demo)
    const statusDot = document.getElementById('statusDot');
    const offlineBanner = document.getElementById('offlineBanner');
    
    // This is just for demo - in real app, would detect actual network state
  </script>
</body>
</html>
