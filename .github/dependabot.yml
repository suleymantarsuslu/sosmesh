# Paused until all implementation steps finish (user decision 2026-10-29)
# open-pull-requests-limit: 0 prevents new PRs; existing PRs closed after STEP 06
version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      production-deps:
        patterns:
          - "*"
        dependency-type: "production"
      dev-deps:
        patterns:
          - "*"
        dependency-type: "development"
    labels:
      - "dependencies"
      - "javascript"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"

  # Gradle (Android) - only if apps/android exists
  - package-ecosystem: "gradle"
    directory: "/apps/android"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "android"
