name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ${{ vars.SOSMESH_CI_RUNNER == 'zulal' && fromJSON('["self-hosted","linux","ARM64","zulal","zulal-verify"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: ${{ vars.SOSMESH_CI_RUNNER != 'zulal' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SOSMESH_CI_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SOSMESH_CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          dest: ${{ runner.temp }}/pnpm-${{ github.job }}
      
      - name: Configure isolated pnpm store (self-hosted parallel jobs)
        shell: bash
        run: |
          STORE_PATH="${{ runner.temp }}/pnpm-store-${{ github.job }}"
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${STORE_PATH}" >> "$GITHUB_ENV"
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ github.job }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ github.job }}-
      
      - name: Install Playwright browsers (GitHub-hosted)
        if: vars.SOSMESH_CI_RUNNER != 'zulal'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install Playwright browsers (Zulal self-hosted)
        if: vars.SOSMESH_CI_RUNNER == 'zulal'
        run: npx playwright install chromium firefox webkit

      - name: Load CI PostgreSQL credentials
        if: vars.SOSMESH_CI_RUNNER == 'zulal'
        shell: bash
        run: |
          PG_ENV=/etc/sosmesh-ci/pg.env
          if [ ! -f "$PG_ENV" ]; then
            echo "Missing ${PG_ENV} on self-hosted runner (required for API DB tests)"
            exit 1
          fi
          set -a
          # shellcheck disable=SC1090
          source "$PG_ENV"
          set +a
          if [ -z "${SOSMESH_CI_PG_ADMIN_URL:-}" ] || [ -z "${SOSMESH_CI_DATABASE_URL:-}" ]; then
            echo "pg.env must define SOSMESH_CI_PG_ADMIN_URL and SOSMESH_CI_DATABASE_URL"
            exit 1
          fi
          echo "::add-mask::${SOSMESH_CI_PG_ADMIN_URL}"
          echo "::add-mask::${SOSMESH_CI_DATABASE_URL}"
          {
            echo "SOSMESH_CI_PG_ADMIN_URL=${SOSMESH_CI_PG_ADMIN_URL}"
            echo "SOSMESH_CI_DATABASE_URL=${SOSMESH_CI_DATABASE_URL}"
          } >> "$GITHUB_ENV"

      - name: Bootstrap PostgreSQL client (no sudo, server-major aware)
        shell: bash
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: bash scripts/ci/bootstrap-pgclient.sh

      - name: Run verification script
        run: bash scripts/verify.sh
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

  contracts:
    name: Contracts Type Check
    runs-on: ${{ vars.SOSMESH_CI_RUNNER == 'zulal' && fromJSON('["self-hosted","linux","ARM64","zulal"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          dest: ${{ runner.temp }}/pnpm-${{ github.job }}
      
      - name: Configure isolated pnpm store (self-hosted parallel jobs)
        shell: bash
        run: |
          STORE_PATH="${{ runner.temp }}/pnpm-store-${{ github.job }}"
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${STORE_PATH}" >> "$GITHUB_ENV"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build contracts
        run: pnpm --filter @sosmesh/contracts build
      
      - name: Type check
        run: cd packages/contracts && npx tsc --noEmit

  detect-mobile:
    name: Detect Mobile Projects
    runs-on: ${{ vars.SOSMESH_CI_RUNNER == 'zulal' && fromJSON('["self-hosted","linux","ARM64","zulal"]') || 'ubuntu-latest' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check mobile projects
        id: check
        run: |
          if [ -f "apps/android/build.gradle" ] || [ -f "apps/android/build.gradle.kts" ]; then
            echo "android=true" >> $GITHUB_OUTPUT
          else
            echo "android=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -d "apps/ios" ] && find apps/ios -name "*.xcodeproj" -type d | grep -q .; then
            echo "ios=true" >> $GITHUB_OUTPUT
          else
            echo "ios=false" >> $GITHUB_OUTPUT
          fi

  android-gradle:
    name: Android Gradle Build
    runs-on: ubuntu-latest
    needs: detect-mobile
    if: needs.detect-mobile.outputs.android == 'true'
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK components
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> apps/android/local.properties
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
      
      - name: Gradle assemble, unit tests, lint
        run: |
          cd apps/android
          ./gradlew assembleProdDebug \
            testProdDebugUnitTest testDemoDebugUnitTest testStagingDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :core:permissions:testDebugUnitTest \
            :core:ble:testDebugUnitTest \
            :core:protocol:testDebugUnitTest \
            :core:platform:testDebugUnitTest \
            :core:wear-companion:testDebugUnitTest \
            :feature-sos:testDebugUnitTest \
            :feature-status:testDebugUnitTest \
            :feature-relay:testDebugUnitTest \
            :mesh-v2:testDebugUnitTest \
            :wear:testDebugUnitTest \
            :contracts-kotlin:test \
            lintProdDebug assembleProdRelease bundleProdRelease ktlintCheck --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/prod/debug/*.apk

  ios-xcode:
    name: iOS Xcode Build
    runs-on: macos-latest
    needs: detect-mobile
    if: needs.detect-mobile.outputs.ios == 'true'
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Lint Swift
        run: |
          if command -v swiftlint &> /dev/null; then
            cd apps/ios && swiftlint lint --strict
          else
            echo "SwiftLint not installed, skipping"
          fi
      
      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild \
            -project SOSMesh.xcodeproj \
            -scheme SOSMesh-iOS \
            -resolvePackageDependencies
      
      - name: Verify generated Xcode project matches golden
        run: |
          set -euo pipefail
          bash apps/ios/scripts/check-xcodeproj-golden.sh

      - name: Build watchOS app
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild \
            -project SOSMesh.xcodeproj \
            -scheme SOSMesh-Watch \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Build watchOS widget extension
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild \
            -project SOSMesh.xcodeproj \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build \
            -target SOSMeshWatchWidgets

      - name: Build iOS app
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild \
            -project SOSMesh.xcodeproj \
            -scheme SOSMesh-iOS \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Resolve iOS Simulator for tests
        id: sim
        run: |
          set -euo pipefail
          SIM_ID=$(python3 <<'PY'
          import json, subprocess, sys
          out = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          data = json.loads(out)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if not d.get("isAvailable"):
                      continue
                  name = d.get("name", "")
                  if name.startswith("iPhone"):
                      candidates.append((name, d["udid"]))
          if not candidates:
              sys.exit("No available iPhone simulators")
          candidates.sort(key=lambda x: x[0])
          print(candidates[-1][1])
          PY
          )
          echo "id=${SIM_ID}" >> "$GITHUB_OUTPUT"
          echo "Using simulator id ${SIM_ID}"
      
      - name: Run tests
        run: |
          set -euo pipefail
          cd apps/ios
          xcodebuild test \
            -project SOSMesh.xcodeproj \
            -scheme SOSMesh-iOS \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:SOSMeshTests

  cross-language-contracts:
    name: Cross-Language Contract Tests
    runs-on: ${{ vars.SOSMESH_CI_RUNNER == 'zulal' && fromJSON('["self-hosted","linux","ARM64","zulal"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          dest: ${{ runner.temp }}/pnpm-${{ github.job }}
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Configure isolated pnpm store (self-hosted parallel jobs)
        shell: bash
        run: |
          STORE_PATH="${{ runner.temp }}/pnpm-store-${{ github.job }}"
          echo "STORE_PATH=${STORE_PATH}" >> "$GITHUB_ENV"
          echo "npm_config_store_dir=${STORE_PATH}" >> "$GITHUB_ENV"
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript contract tests
        run: cd packages/contracts && pnpm test
      
      - name: Write TypeScript canonical JSON outputs
        run: cd packages/contracts && pnpm write-canonical
      
      - name: Run Kotlin contract tests
        run: |
          cd packages/contracts-kotlin
          ./gradlew test --no-daemon
      
      - name: Compare TypeScript and Kotlin golden vectors
        run: |
          echo "Comparing TypeScript and Kotlin canonical outputs..."
          MASTER_GOLDEN="packages/contracts/crypto-test-vectors/golden-001.json"
          KOTLIN_GOLDEN="packages/contracts-kotlin/src/test/resources/golden-001.json"
          if cmp -s "$MASTER_GOLDEN" "$KOTLIN_GOLDEN"; then
            echo "✅ TypeScript and Kotlin canonical outputs match"
          else
            echo "❌ TypeScript and Kotlin canonical outputs differ"
            exit 1
          fi

  swift-package-tests:
    name: Swift Package Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Run Swift contract tests
        run: |
          set -euo pipefail
          echo "=== Swift Contract Tests ==="
          which swift
          swift --version
          cd packages/contracts-swift
          export SOURCE_ROOT="${GITHUB_WORKSPACE}"
          swift test 2>&1 | tee "${GITHUB_WORKSPACE}/swift-contracts-test.log"
          passed_count=$(grep -c 'Test Case.*passed' "${GITHUB_WORKSPACE}/swift-contracts-test.log" 2>/dev/null)
          echo "Swift contracts test lines: ${passed_count:-0}"

      - name: Run SOSMeshCore Swift tests
        run: |
          set -euo pipefail
          cd apps/ios/SOSMeshCore
          export SOURCE_ROOT="${GITHUB_WORKSPACE}"
          swift test 2>&1 | tee "${GITHUB_WORKSPACE}/swift-sosmeshcore-test.log"
          passed_count=$(grep -c 'Test Case.*passed' "${GITHUB_WORKSPACE}/swift-sosmeshcore-test.log" 2>/dev/null)
          echo "SOSMeshCore test lines: ${passed_count:-0}"

      - name: Compare Swift golden vector with master
        run: |
          MASTER_GOLDEN="packages/contracts/crypto-test-vectors/golden-001.json"
          SWIFT_GOLDEN="packages/contracts-swift/Tests/SOSMeshContractsTests/Resources/golden-001.json"
          IOS_CORE_GOLDEN="apps/ios/SOSMeshCore/Tests/SOSMeshCoreTests/Resources/golden-001.json"
          cmp -s "$MASTER_GOLDEN" "$SWIFT_GOLDEN"
          echo "✅ Swift contracts golden matches master"
          cmp -s "$MASTER_GOLDEN" "$IOS_CORE_GOLDEN"
          echo "✅ SOSMeshCore bundled golden matches master"
          MASTER_RADIO="packages/contracts/radio-planner/vectors/radio-planner-cases.json"
          IOS_RADIO="apps/ios/SOSMeshCore/Tests/SOSMeshCoreTests/Resources/radio-planner-cases.json"
          cmp -s "$MASTER_RADIO" "$IOS_RADIO"
          echo "✅ SOSMeshCore bundled radio planner vectors match master"

  secret-scan:
    name: Secret Scan
    runs-on: ${{ vars.SOSMESH_CI_RUNNER == 'zulal' && fromJSON('["self-hosted","linux","ARM64","zulal"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run secret scan
        run: bash scripts/secret-scan.sh
      
      - name: Test secret scan
        run: bash scripts/test-secret-scan.sh

  load-smoke:
    name: Load smoke (k6 profile 100)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SOSMESH_CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          dest: ${{ runner.temp }}/pnpm-${{ github.job }}

      - name: Run k6 ingest smoke
        run: bash tests/load/ci-k6-smoke.sh

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: tests/load/.generated/k6-summary-100.json
          retention-days: 14
