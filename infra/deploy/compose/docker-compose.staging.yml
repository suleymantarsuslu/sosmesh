# Staging-shaped stack for image smoke tests and pre-prod rehearsal.
# build.context paths are relative to this file (infra/deploy/compose/) → repo root is ../../..
# Secrets: inject via environment / secret manager — never commit real values.
# Synthetic seed only; no real PII (see docs/runbooks/deploy.md).

name: sosmesh-staging

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sosmesh_staging}
      POSTGRES_USER: ${POSTGRES_USER:-sosmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD from secret manager}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - staging_pg_data:/var/lib/postgresql/data

  migrate:
    build:
      context: ../../..
      dockerfile: infra/deploy/docker/Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from secret manager}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ../../..
      dockerfile: infra/deploy/docker/Dockerfile.api
    environment:
      NODE_ENV: production
      SOSMESH_ENV: staging
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from secret manager}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET from secret manager}
      METRICS_SCRAPE_AUTH: ${METRICS_SCRAPE_AUTH:?set METRICS_SCRAPE_AUTH from secret manager}
      INGEST_RECEIPT_SIGNING_PRIVATE_KEY: ${INGEST_RECEIPT_SIGNING_PRIVATE_KEY:?from secret manager}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_ENABLED: ${AI_ENABLED:-false}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_BASE_URL: ${META_BASE_URL:-https://api.meta.ai/v1}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      META_MAX_TOKENS: ${META_MAX_TOKENS:-2048}
      AI_DAILY_COST_CAP_USD: ${AI_DAILY_COST_CAP_USD:-1}
      AI_TENANT_RATE_LIMIT_MAX: ${AI_TENANT_RATE_LIMIT_MAX:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_HOST_PORT:-3001}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3001/health/ready >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    build:
      context: ../../..
      dockerfile: infra/deploy/docker/Dockerfile.worker
    environment:
      NODE_ENV: production
      SOSMESH_ENV: staging
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL from secret manager}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET from secret manager}
      METRICS_SCRAPE_AUTH: ${METRICS_SCRAPE_AUTH:?set METRICS_SCRAPE_AUTH from secret manager}
      INGEST_RECEIPT_SIGNING_PRIVATE_KEY: ${INGEST_RECEIPT_SIGNING_PRIVATE_KEY:?from secret manager}
      RETENTION_JOB_ENABLED: ${RETENTION_JOB_ENABLED:-false}
      RETENTION_SOS_MESSAGE_MAX_AGE_SECONDS: ${RETENTION_SOS_MESSAGE_MAX_AGE_SECONDS:-}
      WORKER_HEALTH_PORT: '3002'
      WORKER_RETENTION_INTERVAL_MS: ${WORKER_RETENTION_INTERVAL_MS:-3600000}
      AI_ENABLED: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${WORKER_HOST_PORT:-3002}:3002'
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../../..
      dockerfile: infra/deploy/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_MAP_TEST_MODE: ${NEXT_PUBLIC_MAP_TEST_MODE:-1}
    environment:
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  staging_pg_data:
