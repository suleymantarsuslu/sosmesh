name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run verification script
        run: bash scripts/verify.sh
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

  contracts:
    name: Contracts Type Check
    runs-on: [self-hosted, linux, ARM64, zulal]
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build contracts
        run: pnpm --filter @sosmesh/contracts build
      
      - name: Type check
        run: cd packages/contracts && npx tsc --noEmit

  detect-mobile:
    name: Detect Mobile Projects
    runs-on: [self-hosted, linux, ARM64, zulal]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check mobile projects
        id: check
        run: |
          if [ -f "apps/android/build.gradle" ] || [ -f "apps/android/build.gradle.kts" ]; then
            echo "android=true" >> $GITHUB_OUTPUT
          else
            echo "android=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -d "apps/ios" ] && find apps/ios -name "*.xcodeproj" -type d | grep -q .; then
            echo "ios=true" >> $GITHUB_OUTPUT
          else
            echo "ios=false" >> $GITHUB_OUTPUT
          fi

  android-gradle:
    name: Android Gradle Build
    runs-on: ubuntu-latest
    needs: detect-mobile
    if: needs.detect-mobile.outputs.android == 'true'
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2
      
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Setup Android SDK components
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> apps/android/local.properties
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
      
      - name: Gradle assemble, unit tests, lint
        run: cd apps/android && ./gradlew assembleDebug testDebugUnitTest lintDebug ktlintCheck --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  ios-xcode:
    name: iOS Xcode Build
    runs-on: macos-latest
    needs: detect-mobile
    if: needs.detect-mobile.outputs.ios == 'true'
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      
      - name: Install CocoaPods
        run: cd apps/ios && pod install
      
      - name: Lint Swift
        run: |
          if command -v swiftlint &> /dev/null; then
            cd apps/ios && swiftlint lint --strict
          else
            echo "SwiftLint not installed, skipping"
          fi
      
      - name: Build iOS app
        run: |
          cd apps/ios
          xcodebuild \
            -workspace SOSMesh.xcworkspace \
            -scheme SOSMesh-iOS \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean build
      
      - name: Run tests
        run: |
          cd apps/ios
          xcodebuild test \
            -workspace SOSMesh.xcworkspace \
            -scheme SOSMesh-iOS \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15'

  cross-language-contracts:
    name: Cross-Language Contract Tests
    runs-on: [self-hosted, linux, ARM64, zulal]
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript contract tests
        run: cd packages/contracts && pnpm test
      
      - name: Write TypeScript canonical JSON outputs
        run: cd packages/contracts && pnpm write-canonical
      
      - name: Run Kotlin contract tests
        run: |
          cd packages/contracts-kotlin
          ./gradlew test --no-daemon
      
      - name: Run Swift contract tests
        run: |
          if command -v swift &> /dev/null; then
            echo "=== Swift Contract Tests ==="
            which swift
            swift --version
            cd packages/contracts-swift
            export SOURCE_ROOT="${GITHUB_WORKSPACE}"
            swift test
          else
            echo "::warning::Swift is not installed on this runner. Skipping Swift tests."
            echo "To enable Swift tests, install Swift manually on the self-hosted runner."
            exit 0
          fi
      
      - name: Compare canonical JSON outputs (TypeScript vs Kotlin)
        run: |
          echo "Comparing TypeScript and Kotlin canonical outputs..."
          MASTER_GOLDEN="packages/contracts/crypto-test-vectors/golden-001.json"
          KOTLIN_GOLDEN="packages/contracts-kotlin/src/test/resources/golden-001.json"
          if cmp -s "$MASTER_GOLDEN" "$KOTLIN_GOLDEN"; then
            echo "✅ TypeScript and Kotlin canonical outputs match"
          else
            echo "❌ TypeScript and Kotlin canonical outputs differ"
            exit 1
          fi
          
          if command -v swift &> /dev/null; then
            echo "Comparing with Swift canonical output..."
            SWIFT_GOLDEN="packages/contracts-swift/Tests/SOSMeshContractsTests/Resources/golden-001.json"
            if cmp -s "$MASTER_GOLDEN" "$SWIFT_GOLDEN"; then
              echo "✅ Swift canonical output matches"
            else
              echo "❌ Swift canonical output differs"
              exit 1
            fi
          else
            echo "::warning::Swift not available, skipping Swift canonical comparison"
          fi

  secret-scan:
    name: Secret Scan
    runs-on: [self-hosted, linux, ARM64, zulal]
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run secret scan
        run: bash scripts/secret-scan.sh
      
      - name: Test secret scan
        run: bash scripts/test-secret-scan.sh
