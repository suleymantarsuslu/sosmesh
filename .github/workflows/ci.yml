name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run verification script
        run: bash scripts/verify.sh
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Generate coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
          fi

  contracts:
    name: Contracts Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build contracts
        run: pnpm --filter @sosmesh/contracts build
      
      - name: Type check
        run: cd packages/contracts && npx tsc --noEmit

  detect-mobile:
    name: Detect Mobile Projects
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check mobile projects
        id: check
        run: |
          if [ -f "apps/android/build.gradle" ] || [ -f "apps/android/build.gradle.kts" ]; then
            echo "android=true" >> $GITHUB_OUTPUT
          else
            echo "android=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -d "apps/ios" ] && find apps/ios -name "*.xcodeproj" -type d | grep -q .; then
            echo "ios=true" >> $GITHUB_OUTPUT
          else
            echo "ios=false" >> $GITHUB_OUTPUT
          fi

  android-gradle:
    name: Android Gradle Build
    runs-on: ubuntu-latest
    needs: detect-mobile
    if: needs.detect-mobile.outputs.android == 'true'
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
      
      - name: Lint Kotlin
        run: cd apps/android && ./gradlew ktlintCheck
      
      - name: Build debug APK
        run: cd apps/android && ./gradlew assembleDebug
      
      - name: Run unit tests
        run: cd apps/android && ./gradlew testDebugUnitTest
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk

  ios-xcode:
    name: iOS Xcode Build
    runs-on: macos-latest
    needs: detect-mobile
    if: needs.detect-mobile.outputs.ios == 'true'
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'
      
      - name: Install CocoaPods
        run: cd apps/ios && pod install
      
      - name: Lint Swift
        run: |
          if command -v swiftlint &> /dev/null; then
            cd apps/ios && swiftlint lint --strict
          else
            echo "SwiftLint not installed, skipping"
          fi
      
      - name: Build iOS app
        run: |
          cd apps/ios
          xcodebuild \
            -workspace SOSMesh.xcworkspace \
            -scheme SOSMesh-iOS \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean build
      
      - name: Run tests
        run: |
          cd apps/ios
          xcodebuild test \
            -workspace SOSMesh.xcworkspace \
            -scheme SOSMesh-iOS \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15'

  cross-language-contracts:
    name: Cross-Language Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Swift
        run: |
          # Install Swift on Linux (Ubuntu runner)
          wget -q https://download.swift.org/swift-5.9.2-release/ubuntu2404/swift-5.9.2-RELEASE/swift-5.9.2-RELEASE-ubuntu24.04.tar.gz
          tar xzf swift-5.9.2-RELEASE-ubuntu24.04.tar.gz
          export PATH="$PWD/swift-5.9.2-RELEASE-ubuntu24.04/usr/bin:$PATH"
          echo "$PWD/swift-5.9.2-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
          swift --version
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run TypeScript contract tests
        run: cd packages/contracts && pnpm test
      
      - name: Run Kotlin contract tests
        run: |
          cd packages/contracts-kotlin
          chmod +x gradlew || gradle wrapper
          ./gradlew test
      
      - name: Run Swift contract tests
        run: cd packages/contracts-swift && swift test

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run secret scan
        run: bash scripts/secret-scan.sh
      
      - name: Test secret scan
        run: bash scripts/test-secret-scan.sh
