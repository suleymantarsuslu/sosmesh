<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>SOSMesh — SOS Gönder</title>
  <link rel="stylesheet" href="../../packages/design-tokens/tokens.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: var(--type-fontFamily-base);
      font-size: var(--type-fontSize-base);
      line-height: var(--type-lineHeight-normal);
      background: var(--color-surface-primary);
      color: var(--color-text-primary);
      max-width: 100%;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    
    .header {
      padding: var(--space-4);
      background: var(--color-surface-secondary);
      box-shadow: var(--elevation-2);
      text-align: center;
    }
    
    .header h1 {
      font-size: var(--type-fontSize-xl);
      font-weight: var(--type-fontWeight-semibold);
    }
    
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-8);
    }
    
    .sos-button {
      width: clamp(180px, 40vw, 240px);
      height: 120px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-sos) 0%, var(--color-danger) 100%);
      color: var(--color-text-onSos);
      font-size: var(--type-fontSize-3xl);
      font-weight: var(--type-fontWeight-bold);
      border: none;
      cursor: pointer;
      box-shadow: var(--elevation-4);
      transition: transform 150ms var(--animation-easing-easeOut);
      touch-action: manipulation;
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    
    .sos-button:active {
      transform: scale(0.95);
    }
    
    .progress-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 150ms;
    }
    
    .progress-ring.active {
      opacity: 1;
    }
    
    .progress-ring circle {
      fill: none;
      stroke: white;
      stroke-width: 4;
      stroke-dasharray: 565;
      stroke-dashoffset: 565;
      transform-origin: center;
      animation: progress 3s linear forwards;
    }
    
    @keyframes progress {
      to {
        stroke-dashoffset: 0;
      }
    }
    
    .sos-instructions {
      margin-top: var(--space-4);
      text-align: center;
      color: var(--color-text-secondary);
      font-size: var(--space-4);
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-overlay.visible {
      display: flex;
    }
    
    .modal {
      background: var(--color-surface-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--elevation-5);
      padding: var(--space-6);
      max-width: 90%;
      width: 320px;
    }
    
    .modal-title {
      font-size: var(--type-fontSize-xl);
      font-weight: var(--type-fontWeight-semibold);
      margin-bottom: var(--space-4);
      text-align: center;
    }
    
    .modal-message {
      color: var(--color-text-secondary);
      margin-bottom: var(--space-6);
      text-align: center;
      line-height: var(--type-lineHeight-relaxed);
    }
    
    .modal-actions {
      display: flex;
      gap: var(--space-3);
    }
    
    .button {
      flex: 1;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-base);
      font-weight: var(--type-fontWeight-semibold);
      border: none;
      cursor: pointer;
      min-height: var(--touch-default);
    }
    
    .button-primary {
      background: var(--color-sos);
      color: white;
    }
    
    .button-secondary {
      background: var(--color-surface-tertiary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>SOS Gönder</h1>
  </div>
  
  <main class="main" role="main">
    <button class="sos-button" id="sosButton" aria-label="SOS gönder, 3 saniye basılı tutun">
      <span>SOS</span>
      <svg class="progress-ring" id="progressRing" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" />
      </svg>
    </button>
    <p class="sos-instructions">3 saniye basılı tutun</p>
  </main>
  
  <div class="modal-overlay" id="confirmModal">
    <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <h2 class="modal-title" id="modalTitle">SOS Gönder</h2>
      <p class="modal-message">SOS göndermek istediğinize emin misiniz?</p>
      <div class="modal-actions">
        <button class="button button-secondary" id="cancelBtn">Hayır, İptal</button>
        <button class="button button-primary" id="confirmBtn">Evet, Gönder</button>
      </div>
    </div>
  </div>
  
  <script>
    const sosButton = document.getElementById('sosButton');
    const progressRing = document.getElementById('progressRing');
    const confirmModal = document.getElementById('confirmModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');
    
    let holdTimer;
    let isHolding = false;
    
    sosButton.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      isHolding = true;
      progressRing.classList.add('active');
      
      holdTimer = setTimeout(() => {
        if (isHolding) {
          confirmModal.classList.add('visible');
          progressRing.classList.remove('active');
        }
      }, 3000);
    });
    
    sosButton.addEventListener('pointerup', () => {
      isHolding = false;
      clearTimeout(holdTimer);
      progressRing.classList.remove('active');
    });
    
    sosButton.addEventListener('pointercancel', () => {
      isHolding = false;
      clearTimeout(holdTimer);
      progressRing.classList.remove('active');
    });
    
    cancelBtn.addEventListener('click', () => {
      confirmModal.classList.remove('visible');
    });
    
    confirmBtn.addEventListener('click', () => {
      alert('SOS gönderildi!');
      confirmModal.classList.remove('visible');
    });
  </script>
</body>
</html>
